<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172b3a"><title>ELEMENTARY · Thinking</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;color:#f5f5f5;background:#080808}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:18px;background:#080808}main{max-width:620px;margin:auto;padding:20px;border:1px solid #292929;border-radius:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(1.2rem,5vw,1.65rem);margin:0 0 10px}small{color:#a3a3a3;font-size:.94rem}.counter{background:#242424;border-radius:22px;padding:8px 14px;white-space:nowrap}select,button{font:inherit}select{width:100%;padding:15px 18px;border:1px solid #444;border-radius:18px;background:#080808;color:#fff;margin:22px 0 18px}.card{background:#242424;border-radius:22px;min-height:320px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;gap:22px}.word{font-size:clamp(2.5rem,10vw,4.3rem);font-weight:750;overflow-wrap:anywhere}.meaning{font-size:clamp(1.3rem,5vw,2rem);border-top:1px solid #555;padding-top:20px;width:100%}button{cursor:pointer;border:1px solid #494949;border-radius:16px;padding:14px 12px;background:#252525;color:#f5f5f5;font-weight:600}button.primary{background:#f5f5f5;color:#111;border-color:#f5f5f5}.full{width:100%;margin-top:16px}.two,.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.nav{grid-template-columns:1fr auto 1fr;align-items:center}.nav button{background:transparent;border:0;font-weight:500;color:#ddd;padding:12px 0}.nav button:last-child{text-align:right}.nav small{text-align:center;font-size:.85rem}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;border-top:1px solid #303030;padding-top:15px}button:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:3px}@media(max-width:400px){body{padding:8px}main{padding:14px}.card{min-height:290px}}</style></head><body><main><div class="top"><div><h1>ELEMENTARY · Thinking</h1><small>Interaktiver Wortschatztrainer</small></div><span class="counter" id="count"></span></div><label for="category" style="position:absolute;left:-9999px">Wortgruppe auswählen</label><select id="category"></select><section class="card" aria-live="polite"><div class="word" id="word"></div><div class="meaning" id="meaning" hidden></div></section><button class="primary full" id="reveal">Antwort zeigen</button><div class="two" id="grade" hidden><button id="again">Noch üben</button><button class="primary" id="known">Gewusst</button></div><div class="nav"><button id="prev">‹ Zurück</button><small id="score">0 von 0 gewusst</small><button id="next">Weiter ›</button></div><div class="foot"><small>Neue Übungsrunde starten</small><button id="reset">↻ Neustart</button></div></main><script>
const groups={"Pronomen":[["you","du / ihr"],["he","er"],["it","es"],["we","wir"],["yourself","dich selbst"],["who","wer / derjenige, der"]],"Verben":[["think","denken"],["be","sein"],["beat","schlagen / besiegen"],["dare","sich trauen"],["do","tun"],["like","mögen"],["win","gewinnen"],["can","können"],["will","werden / wollen"],["lose","verlieren"],["have","haben"],["find","finden"],["begin","beginnen"],["get","bekommen"],["rise","aufsteigen"],["go","gehen"],["would","würde"]],"Nomen":[["world","Welt"],["success","Erfolg"],["fellow","Mensch / Kerl"],["will (noun)","Wille"],["state","Zustand"],["mind","Geist / Denkweise"],["prize","Preis / Gewinn"],["life","Leben"],["battle","Kampf"],["man","Mann / Mensch"]],"Adjektive":[["certain","sicher / gewiss"],["stronger","stärker"],["faster","schneller"],["sure","sicher / überzeugt"],["outclassed","unterlegen"]],"Adverbien":[["almost","fast / beinahe"],["not","nicht"],["ever","jemals"],["always","immer"],["sooner","früher / eher"],["later","später"],["high","hoch"],["out","hinaus / draußen"]],"Konjunktionen":[["if","wenn / falls"],["but","aber"],["or","oder"],["for","denn"],["before","bevor"]],"Artikel & andere Wörter":[["a","ein / eine"],["the","der / die / das"],["this","dieser / diese / dieses"],["all","alle / alles"],["in","in"],["with","mit"],["of","von"],["to","zu / Infinitivmarker"]],"Kurzformen":[["you'd","you would – du würdest"],["don't","do not – nicht tun"],["can't","cannot – nicht können"],["won't","will not – nicht werden"],["you'll","you will – du wirst"],["you've","you have – du hast"],["you're","you are – du bist"],["it's","it is – es ist"]]};
const $=id=>document.getElementById(id);let category='Alle Wörter',index=0,revealed=false,correct=0,attempted=0;const deck=()=>category==='Alle Wörter'?Object.values(groups).flat():groups[category];$('category').innerHTML=['Alle Wörter',...Object.keys(groups)].map(x=>`<option>${x}</option>`).join('');function render(){const d=deck(),item=d[index];$('word').textContent=item[0];$('meaning').textContent=item[1];$('meaning').hidden=!revealed;$('reveal').hidden=revealed;$('grade').hidden=!revealed;$('count').textContent=`${index+1} / ${d.length}`;$('score').textContent=`${correct} von ${attempted} gewusst`;}function move(n){index=(index+n+deck().length)%deck().length;revealed=false;render()}$('category').onchange=e=>{category=e.target.value;index=correct=attempted=0;revealed=false;render()};$('reveal').onclick=()=>{revealed=true;render()};$('next').onclick=()=>move(1);$('prev').onclick=()=>move(-1);$('known').onclick=()=>{correct++;attempted++;move(1)};$('again').onclick=()=>{attempted++;move(1)};$('reset').onclick=()=>{index=correct=attempted=0;revealed=false;render()};render();
</script></body></html>
